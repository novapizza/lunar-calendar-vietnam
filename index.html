<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lịch âm dương, ngày tốt xấu, giờ hoàng đạo và sự kiện âm lịch Việt Nam." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)" />

    <!-- Installed app (iOS / Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lịch Âm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
    <title>Lịch Âm Việt Nam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Botpress chat: desktop/tablet only. On phones it is not loaded at all
      // (it covered the tab bar and buttons, and saves data on mobile networks).
      if (window.matchMedia('(min-width: 768px)').matches) {
        var bp = document.createElement('script');
        bp.src = 'https://cdn.botpress.cloud/webchat/v3.6/inject.js';
        bp.onload = function () {
          var cfg = document.createElement('script');
          cfg.src = 'https://files.bpcontent.cloud/2026/03/17/16/20260317162326-0E1ALTJO.js';
          document.body.appendChild(cfg);
        };
        document.body.appendChild(bp);
      }
    </script>
  </body>
</html>
